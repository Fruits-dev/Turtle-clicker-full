<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turtle Clicker: Eternal Deep</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        :root {
            --primary: #005f73; --secondary: #0a9396; --dark: #001219;
            --accent: #ee9b00; --prestige: #9b5de5; --glass: rgba(255, 255, 255, 0.1);
            --sun: #ffb703; --moon: #8ecae6; --wisdom: #94d2bd;
        }
        body { margin:0; font-family: 'Segoe UI', sans-serif; background: radial-gradient(circle at center, var(--primary), var(--dark)); color: white; min-height: 100vh; user-select: none; overflow-x: hidden; }
        .tabs { display: flex; background: rgba(0, 18, 25, 0.95); position: sticky; top: 0; z-index: 100; border-bottom: 2px solid var(--secondary); flex-wrap: wrap; }
        .tabs button { flex: 1; padding: 15px; border: none; background: transparent; color: #94d2bd; font-weight: bold; cursor: pointer; transition: 0.3s; font-size: 12px; text-transform: uppercase; min-width: 100px; }
        .tabs button.active-tab { color: white; background: var(--glass); border-bottom: 4px solid var(--accent); }
        .page { display: none; padding: 20px; max-width: 1200px; margin: auto; animation: fadeIn 0.4s ease; }
        .active { display: block; }
        .center { text-align: center; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .top-stats { background: rgba(0,0,0,0.5); padding: 20px; border-radius: 20px; margin-bottom: 20px; border-bottom: 4px solid var(--accent); }
        .turtle-main { font-size: 100px; cursor: pointer; transition: transform 0.1s; display: inline-block; margin: 20px; filter: drop-shadow(0 0 20px var(--secondary)); }
        .turtle-main:active { transform: scale(0.9); }
        .container { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 15px; }
        .card { background: var(--glass); padding: 15px; border-radius: 12px; border: 1px solid rgba(10, 147, 150, 0.3); position: relative; overflow: hidden; }
        .tech-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 15px; }
        .tech-col { display: flex; flex-direction: column; gap: 10px; background: rgba(0,0,0,0.2); padding: 15px; border-radius: 15px; }
        .node-card { cursor: pointer; border-left: 4px solid transparent; background: var(--glass); padding: 12px; border-radius: 8px; font-size: 14px; position: relative; border: 1px solid rgba(255,255,255,0.05); }
        .node-c { border-left-color: var(--sun); } .node-e { border-left-color: var(--moon); } .node-k { border-left-color: var(--wisdom); }
        .bought { background: var(--accent) !important; color: var(--dark) !important; font-weight: bold; border-color: white !important; }
        .lock-box { display: none; position: absolute; inset: 0; background: rgba(0,0,0,0.9); color: #ff6b6b; font-weight: bold; text-align: center; align-items: center; justify-content: center; z-index: 10; flex-direction: column; padding: 10px; font-size: 13px; }
        .locked-card .lock-box { display: flex; }
        button { width: 100%; padding: 10px; margin-top: 8px; border-radius: 6px; border: none; background: var(--accent); font-weight: bold; cursor: pointer; color: var(--dark); }
        button:disabled { background: #333; color: #666; cursor: not-allowed; }
        #xp-bar-container { width: 240px; height: 10px; background: #111; margin: 10px auto; border-radius: 5px; }
        #xp-bar { height: 100%; background: var(--wisdom); width: 0%; border-radius: 5px; transition: 0.2s; }
    </style>
</head>
<body>

<div class="tabs">
    <button id="tab-game" class="active-tab" onclick="tab('game')">🏠 Abyss</button>
    <button id="tab-army" onclick="tab('army')">🐢 Squad</button>
    <button id="tab-shop" onclick="tab('shop')">🛒 Market</button>
    <button id="tab-tree" onclick="tab('tree')">🧬 Tech</button>
    <button id="tab-soul-shop" style="color:var(--prestige)" onclick="tab('soul-shop')">👻 Forge</button>
    <button id="tab-ascend-tab" onclick="tab('ascend-tab')">✨ Transcend</button>
</div>

<div id="game" class="page active center">
    <div class="top-stats">
        <h1>🐢 <span id="money">0</span></h1>
        <p>Level <span id="lvl">1</span> | Souls: <span id="souls">0</span></p>
        <div id="xp-bar-container"><div id="xp-bar"></div></div>
    </div>
    <div class="turtle-main" onclick="clickTurtle()">🐢</div>
</div>

<div id="army" class="page"><div id="army-container" class="container"></div></div>
<div id="shop" class="page"><div id="shop-container" class="container"></div></div>
<div id="tree" class="page">
    <div class="tech-grid">
        <div class="tech-col" id="col-c"><h3>Aggression</h3></div>
        <div class="tech-col" id="col-e"><h3>Prosperity</h3></div>
        <div class="tech-col" id="col-k"><h3>Insight</h3></div>
    </div>
</div>
<div id="soul-shop" class="page center">
    <h3 style="color:var(--prestige)">Divine Souls: <span id="soul-shop-balance">0</span></h3>
    <div id="soul-shop-container" class="container"></div>
</div>
<div id="ascend-tab" class="page center">
    <div class="card" style="max-width: 400px; margin: auto;">
        <h1 id="pending-souls" style="color: var(--accent);">0</h1>
        <p id="ascend-msg"></p>
        <button id="ascend-btn" onclick="ascend()">TRANSCEND</button>
    </div>
</div>

<script>
const UP_NAMES = ["Beak", "Shell", "Fins", "Breath", "Armor", "Snack", "Boost", "Salt", "Might", "Vision"];
const INITIAL_STATE = {
    money: 0, xp: 0, lvl: 1, xpNeed: 100, souls: 0, ascensions: 0, techRowsUnlocked: 1,
    baseClick: 1, baseAuto: 0, xpMult: 1, nodes: {}, army: {}, upgrades: {},
    soulUpgrades: { s1: {cost: 5, lvl: 0}, s2: {cost: 10, lvl: 0}, s3: {cost: 25, lvl: 0} }
};
let state = JSON.parse(JSON.stringify(INITIAL_STATE));

function formatNum(n) {
    if(n < 1000) return Math.floor(n);
    let i = Math.floor(Math.log10(n) / 3);
    return (n / Math.pow(10, i * 3)).toFixed(2) + ["k", "M", "B", "T", "Qa", "Qi"][i-1];
}

function init() {
    const armyCont = document.getElementById('army-container');
    const shopCont = document.getElementById('shop-container');
    const soulCont = document.getElementById('soul-shop-container');

    for(let i=1; i<=20; i++) {
        state.army['t'+i] = { cost: 15 * Math.pow(10, i-1), power: Math.pow(8, i-1), count: 0 };
        armyCont.innerHTML += `<div class="card" id="card-t${i}"><div class="lock-box">🔒 10x Prev</div><b>Unit ${i}</b><br>Owned: <span id="t${i}-qty">0</span><button id="t${i}-btn" onclick="buyArmy('t${i}')"></button></div>`;
    }
    for(let i=1; i<=10; i++) {
        state.upgrades['u'+i] = { lvlReq: i*5, cost: 50*Math.pow(7, i-1), type: i%2==0?'auto':'click', pwr: 10*Math.pow(7, i-1), lvlOwned: 0 };
        shopCont.innerHTML += `<div class="card" id="card-u${i}"><div class="lock-box">🔒 Level ${i*5}</div><b>${UP_NAMES[i-1]}</b><br>Lv: <span id="u${i}-qty">0</span><button id="u${i}-btn" onclick="buyUpgrade('u${i}')"></button></div>`;
    }
    soulCont.innerHTML = `<div class="card"><b>Haste</b><br>Lv: <span id="s1-qty">0</span><button onclick="buySoul('s1')"></button></div>` +
                         `<div class="card"><b>Memory</b><br>Lv: <span id="s2-qty">0</span><button onclick="buySoul('s2')"></button></div>` +
                         `<div class="card"><b>Keeper</b><br>Lv: <span id="s3-qty">0</span><button onclick="buySoul('s3')"></button></div>`;

    for(let col of ['c','e','k']) {
        const p = document.getElementById('col-'+col);
        for(let i=1; i<=12; i++) {
            p.innerHTML += `<div class="node-card node-${col}" id="card-${col+i}" onclick="buyTree('${col+i}','${col}',${i})"><div class="lock-box">🔒 Row ${i}</div>Row ${i}<br>$${formatNum(100*Math.pow(10,i-1))}</div>`;
        }
    }
    loadGame();
    setInterval(tick, 100);
}

function recalculate() {
    state.baseClick = 1; state.baseAuto = 0; state.xpMult = 1;
    // Add Upgrades
    Object.keys(state.upgrades).forEach(id => {
        let u = state.upgrades[id];
        if(u.type == 'click') state.baseClick += (u.lvlOwned * u.pwr);
        else state.baseAuto += (u.lvlOwned * u.pwr);
    });
    // Add Tech
    Object.keys(state.nodes).forEach(id => {
        let col = id[0], row = parseInt(id.slice(1));
        let bonus = (col=='k') ? 0.5 * row : 50 * Math.pow(10, row-1);
        if(col=='c') state.baseClick += bonus;
        if(col=='e') state.baseAuto += bonus;
        if(col=='k') state.xpMult += bonus;
    });
}

function buyTree(id, type, row) {
    let cost = 100 * Math.pow(10, row-1);
    if(!state.nodes[id] && state.money >= cost && row <= state.techRowsUnlocked) {
        state.money -= cost; state.nodes[id] = true;
        recalculate(); updateUI();
    }
}

function updateUI() {
    document.getElementById("money").innerText = formatNum(state.money);
    document.getElementById("lvl").innerText = state.lvl;
    document.getElementById("souls").innerText = formatNum(state.souls);
    document.getElementById("soul-shop-balance").innerText = formatNum(state.souls);
    document.getElementById("xp-bar").style.width = (state.xp / state.xpNeed * 100) + "%";

    for(let i=1; i<=20; i++) {
        let locked = (i > 1 && state.army['t'+(i-1)].count < 10);
        document.getElementById("card-t"+i).classList.toggle("locked-card", locked);
        if(!locked) {
            document.getElementById("t"+i+"-qty").innerText = state.army['t'+i].count;
            document.getElementById("t"+i+"-btn").innerText = "Hire: " + formatNum(state.army['t'+i].cost);
            document.getElementById("t"+i+"-btn").disabled = state.money < state.army['t'+i].cost;
        }
    }
    for(let i=1; i<=10; i++) {
        let id = 'u'+i, u = state.upgrades[id];
        document.getElementById("card-"+id).classList.toggle("locked-card", state.lvl < u.lvlReq);
        document.getElementById(id+"-qty").innerText = u.lvlOwned;
        document.getElementById(id+"-btn").innerText = "Buy: " + formatNum(u.cost);
        document.getElementById(id+"-btn").disabled = state.money < u.cost;
    }
    for(let col of ['c','e','k']) {
        for(let i=1; i<=12; i++) {
            let id = col+i, card = document.getElementById("card-"+id);
            card.classList.toggle("locked-card", i > state.techRowsUnlocked);
            card.classList.toggle("bought", !!state.nodes[id]);
        }
    }
    let req = (state.ascensions + 1) * 10;
    let earned = Math.floor(Math.sqrt(state.money / 1e6));
    document.getElementById("pending-souls").innerText = formatNum(earned);
    document.getElementById("ascend-btn").disabled = (state.lvl < req);
    document.getElementById("ascend-msg").innerText = (state.lvl < req) ? `Need Level ${req}` : `Ready! Unlock Row ${state.techRowsUnlocked+1}`;
}

function clickTurtle() {
    let p = state.baseClick * (1 + state.souls * 0.01);
    state.money += p; state.xp += p * state.xpMult;
    while(state.xp >= state.xpNeed) { state.xp -= state.xpNeed; state.lvl++; state.xpNeed *= 1.4; }
    updateUI();
}

function buyArmy(id) { let u = state.army[id]; if(state.money>=u.cost){state.money-=u.cost; u.count++; u.cost*=1.35; updateUI();} }
function buyUpgrade(id) { let u = state.upgrades[id]; if(state.money>=u.cost){state.money-=u.cost; u.lvlOwned++; u.cost*=1.7; recalculate(); updateUI();} }
function buySoul(id) { let u = state.soulUpgrades[id]; if(state.souls>=u.cost){state.souls-=u.cost; u.lvl++; u.cost*=2.5; updateUI();} }

function ascend() {
    let earned = Math.floor(Math.sqrt(state.money / 1e6));
    let nextRow = Math.min(12, state.techRowsUnlocked + 1), keptSouls = state.souls + earned, keptAsc = state.ascensions + 1, keptSoulShop = state.soulUpgrades;
    state = JSON.parse(JSON.stringify(INITIAL_STATE));
    state.souls = keptSouls; state.techRowsUnlocked = nextRow; state.ascensions = keptAsc; state.soulUpgrades = keptSoulShop;
    if(state.soulUpgrades.s3.lvl > 0) state.money = 1000;
    localStorage.setItem("turtle_v4", JSON.stringify(state)); location.reload();
}

function tab(id) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById(id).classList.add("active");
    document.querySelectorAll(".tabs button").forEach(b => b.classList.remove("active-tab"));
    document.getElementById("tab-"+id).classList.add("active-tab");
}
function loadGame() { let d = localStorage.getItem("turtle_v4"); if(d) { state = Object.assign(state, JSON.parse(d)); recalculate(); updateUI(); } }
function tick() {
    let mult = (1 + state.souls * 0.01) * (1 + state.soulUpgrades.s1.lvl * 0.25);
    let auto = state.baseAuto; Object.keys(state.army).forEach(k => auto += state.army[k].count * state.army[k].power);
    state.money += (auto * mult) / 10;
    updateUI();
}
init();
</script>
</body>
</html>
